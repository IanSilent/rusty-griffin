<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ржавый Грифон — лавка зачарованного оружия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Ruslan+Display&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0810; --panel:#15101d; --panel2:#1c1527; --line:#3a2d4d; --line2:#55426e;
  --bone:#d8cdb4; --dim:#8d8199; --violet:#8a6bbd; --moss:#7f9f66; --gold:#c9a44c; --blood:#b0524a;
  --title:"Ruslan Display","Old Standard TT",Georgia,serif;
  --body:"Old Standard TT",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--bone);font-family:var(--body);font-size:17px;line-height:1.35}
body{min-height:100vh;background:
  radial-gradient(ellipse at 50% 0%,#231838 0%,transparent 60%),var(--bg)}
/* xerox grain over everything */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.13;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#app{max-width:980px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
h1{font-family:var(--title);font-weight:400;font-size:34px;letter-spacing:2px;margin:0;color:var(--bone);text-shadow:0 0 18px #6b4fa055,2px 2px 0 #000}
.sub{color:var(--dim);font-style:italic;font-size:14px;letter-spacing:1px}
.stats{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:16px}
.stats b{color:var(--gold);font-weight:700}
.stats .fame b{color:var(--violet)}
button{font-family:var(--body);font-size:16px;color:var(--bone);background:var(--panel2);border:1px solid var(--line2);padding:6px 12px;cursor:pointer;border-radius:0}
button:hover:not(:disabled){border-color:var(--gold);color:#fff}
button:disabled{opacity:.35;cursor:default}
button.big{font-family:var(--title);font-size:20px;letter-spacing:1px;padding:10px 22px;border:1px solid var(--gold);box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 3px var(--line2)}
button.sm{font-size:14px;padding:3px 9px}
.frame{background:var(--panel);border:1px solid var(--line2);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px var(--line);padding:14px}
.stage{position:relative;padding:8px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#scene{width:100%;max-width:640px;margin:0 auto;height:auto;aspect-ratio:256/144;background:#000}
#speech{margin-top:8px;min-height:74px;padding:10px 14px;border-left:3px solid var(--violet);background:var(--panel2);font-size:17px}
#speech .who{font-family:var(--title);color:var(--gold);letter-spacing:1px;font-size:17px}
#speech .who small{font-family:var(--body);color:var(--dim);font-style:italic;font-size:14px;letter-spacing:0}
.chip{display:inline-block;border:1px solid var(--blood);color:#e3a39c;font-size:13px;padding:0 7px;margin-left:6px}
#panel{margin-top:12px}
h2{font-family:var(--title);font-weight:400;font-size:20px;letter-spacing:1px;margin:0 0 8px;color:var(--bone)}
h3{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin:12px 0 6px;font-weight:400}
h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tile{text-align:left;padding:6px 8px;min-height:58px;line-height:1.2;display:flex;flex-direction:column;gap:2px}
.tile .n{font-size:16px}
.tile .d{font-size:12.5px;color:var(--dim)}
.tile .c{font-size:12.5px;color:var(--gold)}
.tile.on{border-color:var(--gold);background:#2a1f3a;box-shadow:inset 0 0 0 1px var(--gold)}
.tile.lock{border-style:dashed}
.craftrow{display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.craftrow .txt{flex:1;min-width:200px}
.craftrow .txt .nm{font-size:19px}
.craftrow .txt .cat{color:var(--dim);font-style:italic;font-size:15px}
#prev{width:96px;height:96px;background:var(--bg);border:1px solid var(--line)}
.quest{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px;color:var(--dim);font-size:15px}
.quest b{color:var(--bone);font-weight:400}
.quest .pay{color:var(--gold)}
/* letters */
.letter{display:flex;gap:12px;margin-bottom:10px;background:var(--panel2);border:1px solid var(--line);padding:10px;animation:rise .5s both}
.letter canvas{width:80px;height:112px;background:var(--bg);border:1px solid var(--line);flex:none}
.letter .t{font-family:var(--title);font-size:17px;letter-spacing:1px}
.letter .o0{color:var(--gold)} .letter .o1{color:var(--moss)} .letter .o2{color:var(--dim)} .letter .o3{color:var(--blood)}
.letter p{margin:4px 0;font-style:italic}
.letter ul{margin:4px 0;padding:0;list-style:none;font-size:15px}
.letter li.p{color:#a9c392} .letter li.m{color:#d98d85} .letter li.z{color:var(--dim)}
.letter .pay{color:var(--gold);margin-top:4px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.up{background:var(--panel2);border:1px solid var(--line);padding:9px;display:flex;flex-direction:column;gap:4px}
.up.own{opacity:.55}
.up .n{font-size:17px}
.up .d{font-size:14px;color:var(--dim);flex:1}
.center{text-align:center}
.lead{max-width:640px;margin:8px auto 16px;color:var(--dim);font-style:italic}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
#modal.show{display:flex}
#modal .frame{max-width:720px;width:100%;max-height:92vh;overflow:auto}
.bar{position:relative;height:38px;background:#07050a;border:1px solid var(--line2);margin:14px 0}
.bar .good,.bar .perf{position:absolute;top:0;bottom:0}
.bar .good{background:#3d2a55}
.bar .perf{background:var(--gold);opacity:.75}
.bar .mk{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:var(--bone);box-shadow:0 0 8px #fff}
.hits{letter-spacing:2px;min-height:26px;color:var(--dim)}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:400;font-size:12.5px;letter-spacing:2px;text-transform:uppercase}
.muted{color:var(--dim)}
#tip{position:absolute;display:none;max-width:320px;background:#0b0810;border:1px solid var(--gold);box-shadow:0 0 18px #000;padding:8px 11px;font-size:14.5px;z-index:5;pointer-events:none}
#tip b{font-family:var(--title);font-weight:400;color:var(--gold);letter-spacing:1px;font-size:15px}
.famed{color:var(--violet);font-size:13.5px;border:1px solid var(--violet);padding:0 7px;margin-left:6px;white-space:nowrap}
.chip.vet{border-color:var(--gold);color:var(--gold)}
.letter li{animation:rise .35s both}
.stamp{display:inline-block;font-family:var(--title);font-size:30px;letter-spacing:3px;border:3px double currentColor;padding:2px 16px;margin:8px 0 4px;transform:rotate(-3deg);animation:stamp .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes stamp{from{transform:scale(3.2) rotate(-16deg);opacity:0}}
.letter.flash{animation:flash 1.4s both}
@keyframes flash{0%{box-shadow:0 0 0 0 #c9a44c00;background:#5a4720}30%{box-shadow:0 0 60px 10px #c9a44caa}100%{box-shadow:0 0 14px 0 #c9a44c55;border-color:var(--gold)}}
.letter.shake{animation:shake .5s both}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.gain{margin-top:8px;padding:7px 10px;border:1px solid var(--gold);background:#2a2114;animation:rise .6s both}
.gain b{font-family:var(--title);font-weight:400;color:var(--gold);letter-spacing:1px}
.wait{color:var(--dim);font-style:italic;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
h2 small{font-family:var(--body);font-size:14px;letter-spacing:0}
@media(max-width:600px){h1{font-size:25px}html,body{font-size:16px}.stats{margin-left:0;width:100%}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1>Ржавый Грифон</h1><div class="sub">лавка зачарованного оружия · у Серой заставы</div></div>
    <div class="stats">
      <span>День <b id="sDay">1</b></span>
      <span>Золото <b id="sGold">0</b></span>
      <span class="fame">Слава <b id="sFame">0</b></span>
      <button class="sm" id="bBook">Гримуар</button>
      <button class="sm" id="bMusic" title="Музыка">♪ выкл</button>
    </div>
  </header>
  <div class="frame stage">
    <canvas id="scene" width="256" height="144"></canvas>
    <div id="speech"></div>
    <div id="tip"></div>
  </div>
  <div id="panel" class="frame"></div>
</div>
<div id="modal"><div class="frame" id="modalBody"></div></div>

function evaluate(h,q,it){

  if(!T.cls.includes(M.cls))add(-3,T.name+' '+M.of+'? '+{metal:'Гремит, давит и гнётся не там, где надо',wood:'Щепки летели во все стороны',soft:'Обвис, как мокрая тряпка',stone:'Треснул при первом же деле',bone:'Вышло неудобно и страшновато'}[M.cls],1);
  else if(tf>0)for(const [f,v,t] of q.mat)if(f(M))add(v,M.name+': '+t);
  if(tf>0){
    if(G){const g=q.gems[it.gem];if(g)add(g[0],G.name+': '+g[1]);else add(0,G.name+': красиво блестел, но в деле не пригодился');}
    else if(Object.values(q.gems).some(g=>g[0]>=3))add(0,'Без камня чарам неоткуда было взяться');
  }

  const tier=s>=TH[0]?0:s>=TH[1]?1:s>=TH[2]?2:3;
  return {s,n,tier};
}

function makeHero(usedQ,usedIds){
  const tier=S.fame>=TIERFAME[2]?2:S.fame>=TIERFAME[1]?1:0;
  let fallback=null;
  for(let i=0;i<80;i++){
    const qid=rnd(Object.keys(QUESTS).filter(k=>QUESTS[k].tier<=tier&&!usedQ.includes(k)&&(QUESTS[k].tier>=tier-1||Math.random()<.35)));
    if(!qid)continue;
    const q=QUESTS[qid];let h;
    const pool=S.roster.filter(x=>!usedIds.includes(x.id)&&(!q.cls||q.cls.includes(x.cls)));
    if(pool.length&&Math.random()<.4)h={...rnd(pool),quest:qid,back:true};
    else{
      const race=rnd(Object.keys(RACES)),cls=q.cls?rnd(q.cls):rnd(Object.keys(CLASSES)),f=Math.random()<.45;
      const trait=Math.random()<.5?rnd(Object.keys(TRAITS)):null;
      const names=RACES[race][f?'fn':'mn'].filter(n=>!S.roster.some(x=>x.name===n)&&!D0.includes(n));
      if(!names.length)continue;
      h={race,cls,f,trait,quest:qid,name:rnd(names)};
    }
    if(!fallback&&q.tier===0&&!h.back)fallback=h;
    if(best(h,q,true)>=TH[0]&&best(h,q,false)>=TH[1]){fallback=h;break;}
  }
  const h=fallback||{race:'human',cls:'warrior',f:false,trait:null,quest:'troll',name:'Странник'};
  if(!h.back)h.id=S.nextId++;
  D0.push(h.name);return h;
}

  coin(){if(!this.ctx)return;const t=this.ctx.currentTime;this.note(1568,t,.12,'square',.12,this.sfx);this.note(2093,t+.08,.2,'square',.12,this.sfx);},
  sched(){const a=this.ctx,t=a.currentTime+.1,B=4.4,hz=n=>110*Math.pow(2,n/12);
    // A minor: Am F C G / Am Em F E
    const ch=[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5],[0,3,7],[-5,-2,2],[-4,0,3],[-5,-1,2]][this.bar%8];
    for(const n of ch){this.note(hz(n+12),t,B,'sawtooth',.045);this.note(hz(n+12)*1.006,t,B,'sawtooth',.035);}
    this.note(hz(ch[0]-12),t,B,'triangle',.16);
    const sc=[0,2,3,5,7,8,10,12,14,15];let i=this.mel??4;
    for(let s=0;s<8;s++){if(Math.random()<.62){i=Math.max(0,Math.min(9,i+rnd([-2,-1,-1,1,1,2])));if(s===0)i=sc.indexOf(((ch[rnd([0,1,2])]%12)+12)%12)>=0?sc.indexOf(((ch[rnd([0,1,2])]%12)+12)%12):i;
      this.note(hz(sc[i]+24),t+s*B/8,B/8*1.6,'square',.05);}}
    this.mel=i;this.bar++;this.tm=setTimeout(()=>this.sched(),B*1000);},
  toggle(){this.init();if(!this.ctx)return;this.ctx.resume();this.on=!this.on;clearTimeout(this.tm);
    this.mus.gain.linearRampToValueAtTime(this.on?.5:0,this.ctx.currentTime+.6);if(this.on)this.sched();
    $('bMusic').textContent=this.on?'♪ вкл':'♪ выкл';}
};

    r.pay=Math.round(q.pay*MULT[t]*(S.ups.carpet&&t<=1?1.2:1));r.fame=FAME[t];total+=r.pay;fame+=r.fame;

    r.before=full(rec);const vet=rec.wins>=1;

    if(t===0&&q.tier>=rec.tt){const nt=gt(q.tt,h);if(rec.title!==nt){rec.title=nt;r.newTitle=1;}rec.tt=q.tier;}

      if(vet&&nm)r.relic={kind:'art',type:r.item.type,mat:r.item.mat,gem:r.item.gem,quest:h.quest,name:nm,
        story:gt(`${itemName(r.item)}. С этой вещью ${r.after} ${q.deed} — и вернул{|а} её мастеру: «Пусть висит на почётном месте». День ${S.day}.`,h)};
      else if(!S.relics.some(x=>x.kind==='trophy'&&x.quest===h.quest)&&Math.random()<(q.tier===2?.5:.3))
        r.relic={kind:'trophy',quest:h.quest,name:q.trophy[0],story:gt(`${q.trophy[1]} Прислал{|а} ${r.after}, день ${S.day}.`,h)};
      if(r.relic){S.relics.push(r.relic);fresh.push(r.relic);}

  if(b.id==='bGive')return give();
  if(b.id==='bMarket')return market();
  if(b.id==='bSeal')return reveal();
  if(b.id==='bNextL')return sealed();
  if(b.id==='bDay')return startDay();
  if(b.dataset.up){const u=UPS.find(u=>u.id===b.dataset.up);if(S.gold>=u.cost&&!S.ups[u.id]){S.gold-=u.cost;S.ups[u.id]=1;save();Au.coin();market();}return;}
  if(b.dataset.k&&phase==='shop'){D.pick[b.dataset.k]=b.dataset.id||null;renderShop();}
});
const tip=$('tip');
function relicAt(e){const b=scene.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*256,y=(e.clientY-b.top)/b.height*144;
  const list=S.relics.filter(r=>!r.hid).slice(-6);
  for(let i=0;i<list.length;i++){const [px,py]=SLOTS[i];if(x>=px-2&&x<px+26&&y>=py-2&&y<py+26)return list[i];}return null;}
function showTip(e){const r=relicAt(e);scene.style.cursor=r?'help':'';if(!r){tip.style.display='none';return;}
  tip.innerHTML=`<b>«${r.name}»</b><br>${r.story}`;tip.style.display='block';
  const st=scene.parentNode.getBoundingClientRect();
  tip.style.left=Math.max(4,Math.min(e.clientX-st.left+14,st.width-tip.offsetWidth-4))+'px';tip.style.top=(e.clientY-st.top+16)+'px';}
scene.addEventListener('mousemove',showTip);scene.addEventListener('click',showTip);scene.addEventListener('mouseleave',()=>tip.style.display='none');
document.addEventListener('keydown',e=>{if(e.code==='Space'&&F){e.preventDefault();F.done?give():strike();}});
load();title();requestAnimationFrame(loop);
</script>
